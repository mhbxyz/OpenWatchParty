[package]
name = "session-server"
version = "0.2.1"
edition = "2021"

# Release profile: optimized for production
[profile.release]
lto = false            # Disable LTO for faster compilation
codegen-units = 16     # More parallel codegen units = faster compile
opt-level = 3          # Full optimization for runtime performance
strip = true           # Strip symbols for smaller binary

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
warp = { version = "0.4", features = ["server", "websocket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4"] }
env_logger = "0.10"
log = "0.4"
jsonwebtoken = "9"
base64 = "0.22"
ipnet = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
warp = { version = "0.4", features = ["test", "websocket"] }
