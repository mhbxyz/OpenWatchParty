[package]
name = "owpctl"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "OpenWatchParty installer, configuration and diagnostics tool"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
