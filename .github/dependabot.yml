version: 2
updates:
  - package-ecosystem: cargo
    directory: /src/server
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src/plugins/jellyfin
    schedule:
      interval: weekly
      day: tuesday
    groups:
      nuget-dependencies:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /docs
    schedule:
      interval: weekly
      day: wednesday
    groups:
      bundler-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/clients/jellyfin-web
    schedule:
      interval: weekly
      day: thursday
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra/docker/dev
    schedule:
      interval: weekly
      day: friday

  - package-ecosystem: docker-compose
    directory: /infra/docker/prod
    schedule:
      interval: weekly
      day: friday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      github-actions-dependencies:
        patterns: ["*"]
