name: Rerun CI

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  rerun:
    name: Rerun failed checks
    if: github.event.issue.pull_request != null && github.event.comment.user.login == 'francotosqui' && contains(github.event.comment.body, '/rerun')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: infra/scripts/rerun-pr-checks.sh
