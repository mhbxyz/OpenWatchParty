name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - name: Remove local cargo config (uses mold linker not available in CI)
        run: rm -f .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/plugins/jellyfin
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore OpenWatchParty.Tests/OpenWatchParty.Tests.csproj

      - name: Build
        run: dotnet build OpenWatchParty.Tests/OpenWatchParty.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test OpenWatchParty.Tests/OpenWatchParty.Tests.csproj --no-build --verbosity normal

  js-lint:
    name: JavaScript Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/clients/jellyfin-web/package-lock.json

      - name: Install JS dependencies
        working-directory: src/clients/jellyfin-web
        run: npm ci

      - name: Lint JS recursively
        working-directory: src/clients/jellyfin-web
        run: npm run lint

      - name: Check JS syntax recursively
        working-directory: src/clients/jellyfin-web
        run: npm run check:syntax

      - name: Run JS tests
        working-directory: src/clients/jellyfin-web
        run: npm test

  release-script-tests:
    name: Release Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release scripts
        run: shellcheck infra/scripts/*.sh infra/scripts/tests/*.sh

      - name: Test hostile release metadata
        run: infra/scripts/tests/update-plugin-manifest.test.sh

      - name: Verify version consistency
        run: infra/scripts/tests/verify-versions.test.sh

      - name: Verify plugin metadata generation
        run: infra/scripts/tests/write-plugin-meta.test.sh

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/server
          file: ./infra/docker/server.Dockerfile
          push: false
          tags: openwatchparty/session-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
