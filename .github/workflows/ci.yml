name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Remove local cargo config (uses mold linker not available in CI)
        run: rm -f .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/plugins/jellyfin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore OpenWatchParty.Tests/OpenWatchParty.Tests.csproj

      - name: Build
        run: dotnet build OpenWatchParty.Tests/OpenWatchParty.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test OpenWatchParty.Tests/OpenWatchParty.Tests.csproj --no-build --verbosity normal

  js-lint:
    name: JavaScript Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/clients/jellyfin-web/package-lock.json

      - name: Install JS dependencies
        working-directory: src/clients/jellyfin-web
        run: npm ci

      - name: Lint JS recursively
        working-directory: src/clients/jellyfin-web
        run: npm run lint

      - name: Check JS syntax recursively
        working-directory: src/clients/jellyfin-web
        run: npm run check:syntax

      - name: Run JS tests
        working-directory: src/clients/jellyfin-web
        run: npm test

  release-script-tests:
    name: Release Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check release scripts
        run: shellcheck infra/scripts/*.sh infra/scripts/tests/*.sh

      - name: Verify immutable dependency pins
        run: infra/scripts/verify-pins.sh

      - name: Test immutable dependency verifier
        run: infra/scripts/tests/verify-pins.test.sh

      - name: Test hostile release metadata
        run: infra/scripts/tests/update-plugin-manifest.test.sh

      - name: Verify version consistency
        run: infra/scripts/tests/verify-versions.test.sh

      - name: Verify plugin metadata generation
        run: infra/scripts/tests/write-plugin-meta.test.sh

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/server
          file: ./infra/docker/server.Dockerfile
          push: false
          load: true
          tags: openwatchparty/session-server:test
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test release image
        run: |
          docker run -d --name owp-ci -p 39000:3000 \
            -e JWT_SECRET='B0vLhmX5ZY1mQ4NfIYBcr8VWxOTQ02cbeQ9x7B3K4ow=' \
            -e ALLOW_INSECURE_NO_AUTH=false \
            openwatchparty/session-server:test
          trap 'docker rm -f owp-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:39000/health >/dev/null; then break; fi
            if [[ $attempt -eq 30 ]]; then docker logs owp-ci; exit 1; fi
            sleep 1
          done
          [[ $(docker exec owp-ci id -u) == 1000 ]]
          docker stop --time 10 owp-ci
          docker logs owp-ci 2>&1 | grep -q 'Server shutdown complete'
