name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/server/**'
      - 'infra/docker/server.Dockerfile'
      - 'infra/docker/dev/docker-compose.yml'
      - 'infra/docker/prod/docker-compose.yml'
      - '.github/workflows/publish.yml'
      - 'version.json'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mhbxyz/owp-session-server

permissions: {}

jobs:
  verify-versions:
    name: Verify Release Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.317'

      - name: Verify source versions and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: infra/scripts/verify-versions.sh "$RELEASE_TAG"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [verify-versions]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/server
          file: ./infra/docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_MODE=release

  build-plugin:
    name: Build Jellyfin Plugin
    runs-on: ubuntu-latest
    needs: [verify-versions]
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.317'

      - name: Package plugin
        run: infra/scripts/package-plugin.sh

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jellyfin-plugin
          path: dist/OpenWatchParty-v*.zip
          if-no-files-found: error

      - name: Upload canonical release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jellyfin-plugin-version
          path: version.json

  create-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build-and-push, build-plugin]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-plugin-manifest:
    name: Update Plugin Repository Manifest
    runs-on: ubuntu-latest
    needs: [build-plugin, create-release-assets]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugin artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Download canonical release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jellyfin-plugin-version
          path: artifacts/release-version

      - name: Update manifest.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CHANGELOG: ${{ github.event.release.body }}
          VERSION_FILE: artifacts/release-version/version.json
        run: |
          shopt -s nullglob
          archives=(artifacts/*.zip)
          [[ ${#archives[@]} -eq 1 ]]
          infra/scripts/update-plugin-manifest.sh \
            docs/jellyfin-plugin-repo/manifest.json \
            "${archives[0]}" \
            "$RELEASE_TAG" \
            "$RELEASE_CHANGELOG"

      - name: Commit and push manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jellyfin-plugin-repo/manifest.json
          git commit -m "Update plugin manifest for ${RELEASE_TAG}"
          git push
