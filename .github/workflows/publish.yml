name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/server/**'
      - 'infra/docker/server.Dockerfile'
      - 'infra/docker/dev/docker-compose.yml'
      - 'infra/docker/prod/docker-compose.yml'
      - '.github/workflows/publish.yml'
      - 'version.json'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mhbxyz/owp-session-server

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  verify-versions:
    name: Verify Release Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.317'

      - name: Verify source versions and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: infra/scripts/verify-versions.sh "$RELEASE_TAG"

  release-security-gate:
    name: Release Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image for scanning
        run: docker build --build-arg BUILD_MODE=release -f infra/docker/server.Dockerfile -t owp-release:scan ./src/server
      - name: Block HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: owp-release:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [verify-versions, release-security-gate]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src/server
          file: ./infra/docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_MODE=release

  secure-image:
    name: Sign & Attest Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
      IMAGE_REF: ghcr.io/mhbxyz/owp-session-server@${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create supply-chain asset directory
        run: mkdir -p artifacts

      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: artifacts/owp-session-server.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: artifacts/owp-session-server.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate image SBOMs
        run: |
          infra/scripts/validate-sbom.sh artifacts/owp-session-server.spdx.json
          infra/scripts/validate-sbom.sh artifacts/owp-session-server.cyclonedx.json

      - name: Attest image provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify image
        run: |
          cosign sign --yes --bundle artifacts/owp-session-server.sigstore.json "$IMAGE_REF"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"

      - name: Verify image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify "oci://$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --cert-identity "$CERTIFICATE_IDENTITY"
          cp -- "$PROVENANCE_BUNDLE" artifacts/owp-session-server.provenance.jsonl

      - name: Upload signed image metadata
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-supply-chain
          path: artifacts/*
          if-no-files-found: error

  build-plugin:
    name: Build Jellyfin Plugin
    runs-on: ubuntu-latest
    needs: [verify-versions]
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.317'

      - name: Package plugin
        run: infra/scripts/package-plugin.sh

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jellyfin-plugin
          path: dist/OpenWatchParty-v*.zip
          if-no-files-found: error

      - name: Upload canonical release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jellyfin-plugin-version
          path: version.json

  secure-plugin:
    name: Sign & Attest Jellyfin Plugin
    runs-on: ubuntu-latest
    needs: [build-plugin]
    if: github.event_name == 'release'
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Locate plugin archive
        id: plugin
        run: |
          shopt -s nullglob
          archives=(artifacts/OpenWatchParty-v*.zip)
          [[ ${#archives[@]} -eq 1 ]]
          printf 'path=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$(basename -- "${archives[0]}")" >> "$GITHUB_OUTPUT"

      - name: Generate plugin SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.plugin.outputs.path }}
          format: spdx-json
          output-file: artifacts/${{ steps.plugin.outputs.name }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate plugin CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.plugin.outputs.path }}
          format: cyclonedx-json
          output-file: artifacts/${{ steps.plugin.outputs.name }}.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate and validate plugin metadata
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.name }}
          PLUGIN_PATH: ${{ steps.plugin.outputs.path }}
        run: |
          infra/scripts/write-sha256.sh "$PLUGIN_PATH" "$PLUGIN_PATH.sha256"
          infra/scripts/verify-checksum.sh "$PLUGIN_PATH.sha256" "$PLUGIN_PATH"
          infra/scripts/validate-sbom.sh "artifacts/$PLUGIN_NAME.spdx.json"
          infra/scripts/validate-sbom.sh "artifacts/$PLUGIN_NAME.cyclonedx.json"

      - name: Attest plugin provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.plugin.outputs.path }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify plugin
        env:
          PLUGIN_PATH: ${{ steps.plugin.outputs.path }}
        run: |
          cosign sign-blob --yes --bundle "$PLUGIN_PATH.sigstore.json" "$PLUGIN_PATH"
          cosign verify-blob \
            --bundle "$PLUGIN_PATH.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$PLUGIN_PATH"

      - name: Verify plugin provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_PATH: ${{ steps.plugin.outputs.path }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify "$PLUGIN_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --cert-identity "$CERTIFICATE_IDENTITY"
          cp -- "$PROVENANCE_BUNDLE" "$PLUGIN_PATH.provenance.jsonl"

      - name: Upload signed plugin assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-supply-chain
          path: artifacts/*
          if-no-files-found: error

  secure-owpctl:
    name: Build, Sign & Attest owpctl
    runs-on: ubuntu-latest
    needs: [verify-versions]
    if: github.event_name == 'release'
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - name: Build owpctl
        run: |
          cargo build --release --locked --manifest-path src/owpctl/Cargo.toml
          mkdir -p artifacts
          cp src/owpctl/target/release/owpctl artifacts/owpctl-linux-x86_64
          chmod 0755 artifacts/owpctl-linux-x86_64
          infra/scripts/write-sha256.sh artifacts/owpctl-linux-x86_64 artifacts/owpctl-linux-x86_64.sha256
      - name: Attest owpctl provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/owpctl-linux-x86_64
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify owpctl
        run: |
          cosign sign-blob --yes --bundle artifacts/owpctl-linux-x86_64.sigstore.json artifacts/owpctl-linux-x86_64
          cosign verify-blob --bundle artifacts/owpctl-linux-x86_64.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            artifacts/owpctl-linux-x86_64
      - name: Preserve provenance
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" artifacts/owpctl-linux-x86_64.provenance.jsonl
      - name: Upload owpctl supply-chain assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owpctl-supply-chain
          path: artifacts/*
          if-no-files-found: error

  create-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [secure-image, secure-plugin, secure-owpctl]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download image supply-chain assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-supply-chain
          path: artifacts

      - name: Download plugin supply-chain assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-supply-chain
          path: artifacts

      - name: Download owpctl supply-chain assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owpctl-supply-chain
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-plugin-manifest:
    name: Update Plugin Repository Manifest
    runs-on: ubuntu-latest
    needs: [build-plugin, create-release-assets]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Download canonical release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jellyfin-plugin-version
          path: artifacts/release-version

      - name: Update manifest.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CHANGELOG: ${{ github.event.release.body }}
          VERSION_FILE: artifacts/release-version/version.json
        run: |
          shopt -s nullglob
          archives=(artifacts/*.zip)
          [[ ${#archives[@]} -eq 1 ]]
          infra/scripts/update-plugin-manifest.sh \
            docs/jellyfin-plugin-repo/manifest.json \
            "${archives[0]}" \
            "$RELEASE_TAG" \
            "$RELEASE_CHANGELOG"

      - name: Commit and push manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jellyfin-plugin-repo/manifest.json
          git commit -m "Update plugin manifest for ${RELEASE_TAG}"
          git push
