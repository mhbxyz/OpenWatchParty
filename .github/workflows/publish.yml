name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/server/**'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mhbxyz/owp-session-server

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/server
          file: ./infra/docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_MODE=release

  build-plugin:
    name: Build Jellyfin Plugin
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build plugin
        working-directory: src/plugins/jellyfin/OpenWatchParty
        run: dotnet publish -c Release -o dist

      - name: Create plugin zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          cd src/plugins/jellyfin/OpenWatchParty/dist
          zip -r "../OpenWatchParty-${RELEASE_TAG}.zip" .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: src/plugins/jellyfin/OpenWatchParty/OpenWatchParty-*.zip

  create-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build-and-push, build-plugin]
    if: github.event_name == 'release'
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-plugin-manifest:
    name: Update Plugin Repository Manifest
    runs-on: ubuntu-latest
    needs: [build-plugin, create-release-assets]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Update manifest.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CHANGELOG: ${{ github.event.release.body }}
        run: |
          shopt -s nullglob
          archives=(artifacts/*.zip)
          [[ ${#archives[@]} -eq 1 ]]
          infra/scripts/update-plugin-manifest.sh \
            docs/jellyfin-plugin-repo/manifest.json \
            "${archives[0]}" \
            "$RELEASE_TAG" \
            "$RELEASE_CHANGELOG"

      - name: Commit and push manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jellyfin-plugin-repo/manifest.json
          git commit -m "Update plugin manifest for ${RELEASE_TAG}"
          git push
