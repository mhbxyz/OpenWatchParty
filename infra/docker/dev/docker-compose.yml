services:
  session-server:
    build:
      context: ../../../src/server
      dockerfile: ../../infra/docker/server.Dockerfile
      args:
        BUILD_MODE: dev
    container_name: owp-session-server
    ports:
      - "${SESSION_SERVER_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${OWP_TRUST_STORE_DIR:-./trust}:/var/lib/openwatchparty:ro
    restart: unless-stopped
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8096,https://localhost:8096}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_AUTH_MODE=${JWT_AUTH_MODE:-hs256}
      - JWT_TRUST_STORE_PATH=${JWT_TRUST_STORE_PATH:-/var/lib/openwatchparty/trust-store.json}
      - ALLOW_INSECURE_NO_AUTH=${ALLOW_INSECURE_NO_AUTH:-true}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-OpenWatchParty}
      - JWT_ISSUER=${JWT_ISSUER:-Jellyfin}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-256}
      - MAX_CONNECTIONS_PER_IP=${MAX_CONNECTIONS_PER_IP:-32}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - AUTH_TIMEOUT_SECONDS=${AUTH_TIMEOUT_SECONDS:-10}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PORT:-3000}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  jellyfin-dev:
    # The tag follows version.json; update this digest when that version changes.
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-10.11.3}@sha256:1edf3f17997acbe139718f252a7d2ded2706762390d787a34204668498dbc5f6
    container_name: jellyfin-dev
    environment:
      - PUID=${UID:-1000}
      - PGID=${GID:-1000}
    depends_on:
      - session-server
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_DIR:-${HOME}/Videos/Movies}:/media/Movies:ro
      - ../../../src/clients/jellyfin-web:/jellyfin/jellyfin-web/plugins/openwatchparty:ro
      - ../../../src/plugins/jellyfin/OpenWatchParty/dist:/config/plugins/OpenWatchParty
      - ./scripts/jellyfin-entrypoint.sh:/jellyfin-entrypoint.sh:ro
    restart: unless-stopped
    entrypoint: /jellyfin-entrypoint.sh

  plugin-builder:
    image: mcr.microsoft.com/dotnet/sdk:9.0@sha256:35048e3a81e6a07c316e7bbbd80d80d2ba705fe5f23a8ed42b6638c8f4c20d30
    working_dir: /workspace/OpenWatchParty
    profiles:
      - tools
    volumes:
      - ../../../src/plugins/jellyfin:/workspace
      - ../../../global.json:/workspace/global.json:ro
    environment:
      - HOME=/tmp
      - DOTNET_CLI_HOME=/tmp/.dotnet
    command: dotnet publish -c Release -p:RestoreLockedMode=true -o /workspace/OpenWatchParty/dist OpenWatchPartyPlugin.csproj

volumes:
  jellyfin-cache:
