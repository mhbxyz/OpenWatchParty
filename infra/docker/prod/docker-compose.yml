services:
  session-server:
    image: ghcr.io/mhbxyz/owp-session-server:0.8.0@sha256:e0634bf2fafd59bcb612c0ec93cb7e54190eb5b00c8c37ee0680b9e92ee29f68
    container_name: owp-session-server
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${OWP_TRUST_STORE_DIR:-./trust}:/var/lib/openwatchparty:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SESSION_SERVER_BIND:-127.0.0.1}:${SESSION_SERVER_PORT:-3000}:${PORT:-3000}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8096,https://localhost:8096}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_AUTH_MODE=${JWT_AUTH_MODE:-hs256}
      - JWT_TRUST_STORE_PATH=${JWT_TRUST_STORE_PATH:-/var/lib/openwatchparty/trust-store.json}
      - ALLOW_INSECURE_NO_AUTH=false
      - JWT_AUDIENCE=${JWT_AUDIENCE:-OpenWatchParty}
      - JWT_ISSUER=${JWT_ISSUER:-Jellyfin}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-256}
      - MAX_CONNECTIONS_PER_IP=${MAX_CONNECTIONS_PER_IP:-32}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - AUTH_TIMEOUT_SECONDS=${AUTH_TIMEOUT_SECONDS:-10}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PORT:-3000}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  plugin-builder:
    image: mcr.microsoft.com/dotnet/sdk:11.0@sha256:65f3c7c6a25a239ab3e6719f2896147e7b68242ff2d8818dd70498bde6ef8bea
    working_dir: /workspace/OpenWatchParty
    profiles:
      - tools
    volumes:
      - ../../../src/plugins/jellyfin:/workspace
      - ../../../global.json:/workspace/global.json:ro
    environment:
      - HOME=/tmp
      - DOTNET_CLI_HOME=/tmp/.dotnet
    command: dotnet publish -c Release -p:RestoreLockedMode=true -o /workspace/OpenWatchParty/dist OpenWatchPartyPlugin.csproj
