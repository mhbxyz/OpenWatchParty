title: OpenWatchParty
description: Synchronized watch parties for Jellyfin
remote_theme: just-the-docs/just-the-docs@v0.10.0

# The Actions build uses plain Jekyll; give every documentation page the
# theme layout explicitly (index.md keeps its own `home` layout).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# The remote theme is fetched by this plugin, which the github-pages
# meta-gem used to whitelist for us.
plugins:
  - jekyll-remote-theme

# GitHub repository
repository: mhbxyz/OpenWatchParty

# The custom GitHub Pages domain serves this project at the domain root.
url: "https://openwatchparty.com"
baseurl: ""

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/mhbxyz/OpenWatchParty"

aux_links_new_tab: true

# Footer
footer_content: "OpenWatchParty - Synchronized watch parties for Jellyfin"

# Color scheme (light/dark)
color_scheme: dark

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Code copy button
enable_copy_code_button: true

# Callouts
callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Permalinks - pretty URLs without .html
permalink: pretty

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
